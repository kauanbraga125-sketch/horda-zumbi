name: Horda Zumbi 0.10.29 — preservar projeto e publicar APK

on:
  push:
    branches: [main]
    paths:
      - 'release-v0.10.29/**'
      - '.github/workflows/horda-v01029.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horda-v01029-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruir e conferir os bytes preservados
        run: python3 release-v0.10.29/restore_release.py --apply-source --package-source --out dist
      - name: Conferir assinatura Android
        shell: bash
        run: |
          set -euo pipefail
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs dist/Horda-Zumbi-v0.10.29-ARM64.apk > dist/Assinatura-v0.10.29.txt
          grep -q 'a641a59f39561af0210f2f1cd246f58c5bfd9ab05462bf5b0635e626d681d15d' dist/Assinatura-v0.10.29.txt
          (cd dist && sha256sum Assinatura-v0.10.29.txt >> SHA256SUMS.txt)
      - name: Atualizar os fontes completos no repositório
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all monster-game
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza projeto completo para Horda Zumbi 0.10.29'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publicar APK e cópia independente dos fontes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.10.29 >/dev/null 2>&1; then
            mkdir -p existing
            gh release download v0.10.29 --pattern Horda-Zumbi-v0.10.29-ARM64.apk --dir existing
            cmp existing/Horda-Zumbi-v0.10.29-ARM64.apk dist/Horda-Zumbi-v0.10.29-ARM64.apk
            echo 'APK idêntico já preservado na versão publicada.'
          else
            gh release create v0.10.29 dist/* --target "$SOURCE_SHA" --title 'Horda Zumbi 0.10.29 — acessórios e animações' --notes-file monster-game/CORRECAO-v0.10.29.md --prerelease
          fi
      - name: Preservar diagnóstico se a publicação falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horda-v01029-diagnostico
          path: dist/*.txt
          if-no-files-found: ignore
