name: Horda Zumbi 0.10.3 — publicar APK verificado

on:
  push:
    branches: ['publish/v0.10.3']
  create:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horda-release-v0103
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/publish/v0.10.3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ler identificação da entrega
        id: release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('release-v0.10.3/manifest.json').read_text())
          assert m['version']=='0.10.3'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('source_sha='+m['source_sha']+'\n')
          PY
      - name: Obter fontes exatas da nova versão
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: source
      - name: Obter cópia preservada da base
        uses: actions/checkout@v4
        with:
          ref: '5227bf59805b107ffbd2071ed125c63d4e4cf36d'
          path: preserved
          sparse-checkout: backups/v0.10.2
      - name: Restaurar base e preparar atualização assinada
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xdelta3
          python3 preserved/backups/v0.10.2/restaurar.py --output base
          python3 release-v0.10.3/package_release.py --root release-v0.10.3 --source source --base base/Horda-Zumbi-v0.10.2.apk --out dist
      - name: Conferir assinatura Android preservada
        run: |
          set -euo pipefail
          SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose --print-certs dist/Horda-Zumbi-v0.10.3.apk > dist/Assinatura-v0.10.3.txt
          grep -q '78278cf6478de24cfb84f6370d5bf0e800319fe512b4f5aaa62f83611bfb61e8' dist/Assinatura-v0.10.3.txt
      - name: Publicar APK, fontes e prévia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh release view v0.10.3 >/dev/null 2>&1; then
            mkdir existing
            gh release download v0.10.3 --pattern SHA256SUMS.txt --dir existing
            grep -q 'd8cd026d8676f069e8195912dafa5911eb2876bc8f69c10b0126559a4f14652f' existing/SHA256SUMS.txt
            echo 'A entrega verificada já foi publicada.'
            exit 0
          fi
          gh release create v0.10.3 dist/* --target "$SOURCE_SHA" --title 'Horda Zumbi 0.10.3 — Livro dos Mortos' --notes-file source/monster-game/NOTAS-v0.10.3.md --latest
      - name: Guardar diagnóstico se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: horda-v0103-publicacao-diagnostico
          path: dist/*.txt
          if-no-files-found: ignore
