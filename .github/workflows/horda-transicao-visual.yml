name: Horda 0.10.52 — testar obstaculos, rampa e gameplay no esgoto

on:
  push:
    branches: [main]
    paths:
      - 'monster-game/**'
      - '.github/workflows/horda-transicao-visual.yml'
  pull_request:
    paths:
      - 'monster-game/**'
      - '.github/workflows/horda-transicao-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Godot 4.5.1 e ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Importar sprites, texturas, fontes e cenas
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path monster-game --editor --import > "$RUNNER_TEMP/import.log" 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' "$RUNNER_TEMP/import.log"; then cat "$RUNNER_TEMP/import.log"; exit 1; fi
          python3 monster-game/tools/refresh_startup_integrity.py
      - name: Testar transicoes, camera e integridade dos personagens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transitions"
          XDG_DATA_HOME="$RUNNER_TEMP/test-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/transitions" xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v141_transitions.gd | tee "$RUNNER_TEMP/test.log"
          grep -q '"failures":\[\]' "$RUNNER_TEMP/test.log"
      - name: Conferir cenario, cascos e efeitos na agua
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          XDG_DATA_HOME="$RUNNER_TEMP/sewer-rules-user" "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --headless --path monster-game --audio-driver Dummy --script res://tests/v140_sewer.gd 2>&1 | tee "$RUNNER_TEMP/v140_sewer.log"
          grep -q '"failures":\[\]' "$RUNNER_TEMP/v140_sewer.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/v140_sewer.log"; then exit 1; fi
          for suite in v140_faces v144_descent v145_surface v147_reveal v148_fog v149_solo v151_water; do
            XDG_DATA_HOME="$RUNNER_TEMP/$suite-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/$suite" xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            grep -q '"failures":\[\]' "$RUNNER_TEMP/$suite.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done
          cp "$RUNNER_TEMP/v140_faces/faces.json" dist/Pilotos-v0.10.52.json
          cp "$RUNNER_TEMP/v144_descent/descent.json" dist/Recorte-v0.10.52.json
          cp "$RUNNER_TEMP/v145_surface/surface.json" dist/Continuidade-v0.10.52.json
          cp "$RUNNER_TEMP/v147_reveal/reveal.json" dist/Revelacao-v0.10.52.json
          cp "$RUNNER_TEMP/v148_fog/fog.json" dist/Neblina-v0.10.52.json
          cp "$RUNNER_TEMP/v149_solo/solo.json" dist/Jet-Skis-v0.10.52.json
          cp "$RUNNER_TEMP/v151_water/water.json" dist/Agua-v0.10.52.json
          cp "$RUNNER_TEMP/transitions/transitions.json" dist/Trajetorias-v0.10.52.json
      - name: Gravar gameplay no esgoto a 30 fps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/video" dist
          HORDA_WATER_PREVIEW=1 XDG_DATA_HOME="$RUNNER_TEMP/preview-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/video" xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v145_full_cycle.gd 2>&1 | tee "$RUNNER_TEMP/preview.log"
          grep -q V145_PREVIEW_OK "$RUNNER_TEMP/preview.log"
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/preview.log"; then exit 1; fi
          ffmpeg -hide_banner -loglevel warning -y -framerate 30 -i "$RUNNER_TEMP/video/frame-%04d.jpg" -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p -movflags +faststart dist/Horda-v0.10.52-Gameplay-Esgoto.mp4
          cp "$RUNNER_TEMP/video/replay.json" dist/Partida-v0.10.52.json
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Entregar video e relatorios
        uses: actions/upload-artifact@v4
        with:
          name: Horda-Zumbi-v0.10.52-Gameplay-Esgoto
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Preservar diagnostico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Horda-Zumbi-v0.10.52-Erro-Visual
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/preview.log
            ${{ runner.temp }}/v140_sewer.log
            ${{ runner.temp }}/v140_faces.log
            ${{ runner.temp }}/v144_descent.log
            ${{ runner.temp }}/v145_surface.log
            ${{ runner.temp }}/v147_reveal.log
            ${{ runner.temp }}/v148_fog.log
            ${{ runner.temp }}/v149_solo.log
            ${{ runner.temp }}/v151_water.log
          if-no-files-found: ignore
