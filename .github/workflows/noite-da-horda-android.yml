name: Horda Zumbi — validar fontes completas
on:
  push:
    branches: [main]
    paths: ['monster-game/**', '.github/workflows/noite-da-horda-android.yml']
  pull_request:
    paths: ['monster-game/**', '.github/workflows/noite-da-horda-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.5.1 oficial
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Importar fontes sem cache e atualizar auditoria
        id: import
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path monster-game --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' /tmp/import.log; then exit 1; fi
          python3 monster-game/tools/refresh_startup_integrity.py
      - name: Validar progressão, inventário, livro e inicialização
        run: |
          set -euo pipefail
          for SUITE in v100_integration v101_integration v103_codex v103_apk_runtime v104_integration v105_integration; do
            /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path monster-game --script "res://tests/${SUITE}.gd" 2>&1 | tee "/tmp/${SUITE}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|FAIL |failures=[1-9]' "/tmp/${SUITE}.log"; then exit 1; fi
            grep -E 'RESULT.*failures=0' "/tmp/${SUITE}.log"
          done
      - name: Validar abertura, saldo de testes e poder espacial
        run: |
          set -euo pipefail
          for SUITE in verify_packaged_boot v129_currency v135_adventure v135_readability v135_flight v135_contacts v140_systems v140_sewer v161_routes v162_regression v163_landscape v164_cosmic v165_regions v166_pop v169_package v170_aviary v171_species v172_pipoco v173_fiapo v174_fetch v175_ferrugem v178_ritual; do
            /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --audio-driver Dummy --path monster-game --script "res://tests/${SUITE}.gd" -- --space-test 2>&1 | tee "/tmp/${SUITE}.log"
            if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' "/tmp/${SUITE}.log"; then exit 1; fi
          done
      - name: Conferir saldo e acesso ao espaço na abertura normal
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          for FIXTURE in new existing; do
            XDG_DATA_HOME="$RUNNER_TEMP/horda-startup-${FIXTURE}" HORDA_STARTUP_FIXTURE="$FIXTURE" HORDA_VALIDATION_DIR="$RUNNER_TEMP/startup-${FIXTURE}" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v141_startup.gd 2>&1 | tee "/tmp/startup-${FIXTURE}.log"
            if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' "/tmp/startup-${FIXTURE}.log"; then exit 1; fi
          done
      - name: Conferir recorte real dos ocupantes nas cabines
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/cabins" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v133_cabins.gd 2>&1 | tee /tmp/cabins.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/cabins.log; then exit 1; fi
      - name: Conferir sorteio, fusão, reabertura e controles do esgoto
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v136-transactions" HORDA_VALIDATION_DIR="$RUNNER_TEMP/transactions-v136" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v169_package.gd 2>&1 | tee /tmp/transactions-v136.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/transactions-v136.log; then exit 1; fi
      - name: Conferir todas as poses novas e os 35 acessórios sentados
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/riders-v138" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v140_riders.gd 2>&1 | tee /tmp/riders-v138.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/riders-v138.log; then exit 1; fi
          grep -q 'V140_RIDERS_OK' /tmp/riders-v138.log
      - name: Conferir opacidade dos rostos em todas as poses e acessórios
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/faces-v140" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v140_faces.gd 2>&1 | tee /tmp/faces-v140.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/faces-v140.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/faces-v140.log
      - name: Conferir limites reais de cada quadro da enchente
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/atlas-v140" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v140_atlas.gd 2>&1 | tee /tmp/atlas-v140.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/atlas-v140.log; then exit 1; fi
          grep -q 'V140_ATLAS' /tmp/atlas-v140.log
      - name: Conferir fim da rua e queda em três formatos de tela
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/transition-v141-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/transitions-v141" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v161_routes.gd 2>&1 | tee /tmp/transitions-v141.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/transitions-v141.log; then exit 1; fi
          grep -q 'V161_ROUTES' /tmp/transitions-v141.log
      - name: Conferir laboratório, cinco ovos, fusão e fragmentos do livro
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v170-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v170_aviary.gd 2>&1 | tee /tmp/aviary-v170.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/aviary-v170.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/aviary-v170.log
          grep -q '"rendered":true' /tmp/aviary-v170.log
      - name: Conferir espécies diferentes na fusão e nos dois ninhos
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v171-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v171" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v171_species.gd 2>&1 | tee /tmp/species-v171.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/species-v171.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/species-v171.log
          grep -q '"rendered":true' /tmp/species-v171.log
      - name: Conferir Pipoco, moedas físicas, pausa e coleta
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v172-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v172" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v172_pipoco.gd 2>&1 | tee /tmp/pipoco-v172.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/pipoco-v172.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/pipoco-v172.log
          grep -q '"rendered":true' /tmp/pipoco-v172.log
      - name: Conferir Fiapo buscando e carregando civis
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v173-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v173" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v173_fiapo.gd 2>&1 | tee /tmp/fiapo-v173.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/fiapo-v173.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/fiapo-v173.log
          grep -q '"rendered":true' /tmp/fiapo-v173.log
      - name: Conferir busca fora da tela e civil novo do Fiapo
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v174-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v174" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v174_fetch.gd 2>&1 | tee /tmp/fetch-v174.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/fetch-v174.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/fetch-v174.log
          grep -q '"rendered":true' /tmp/fetch-v174.log
      - name: Conferir carga, laser e destruição completa do Ferrugem
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v175-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v175" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v175_ferrugem.gd 2>&1 | tee /tmp/ferrugem-v175.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/ferrugem-v175.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/ferrugem-v175.log
          grep -q '"rendered":true' /tmp/ferrugem-v175.log
      - name: Conferir morte, invocação e retorno do Agourinho
        if: ${{ !cancelled() && steps.import.outcome == 'success' }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v178-user" HORDA_VALIDATION_DIR="$RUNNER_TEMP/aviary-v170/v178" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v178_ritual.gd 2>&1 | tee /tmp/agourinho-v178.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/agourinho-v178.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/agourinho-v178.log
          grep -q '"rendered":true' /tmp/agourinho-v178.log
      - name: Guardar capturas do laboratório e do livro
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Aves-Malditas-v178-fontes
          path: ${{ runner.temp }}/aviary-v170/**
          if-no-files-found: ignore
          retention-days: 30
