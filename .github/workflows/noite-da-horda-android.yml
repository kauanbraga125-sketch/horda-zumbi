name: Horda 0.8.13 ESTAVEL — somente esqueleto (limpo)

on:
  workflow_dispatch:
  push:
    branches: [feat/esqueleto-0813-base-estavel-limpa]
    paths: ['monster-game/**', '.github/workflows/noite-da-horda-android.yml']

permissions:
  contents: read

concurrency:
  group: noite-da-horda-0813-esqueleto-limpo
  cancel-in-progress: false

jobs:
  build-android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Extract approved images ONLY (never overwrite any zombie code)
        run: |
          set -euo pipefail
          test -s monster-game/sprites_aprovados.zip
          mkdir -p monster-game/assets/art/esqueleto_aprovado
          for sprite in corrida pulo_pouso quebrar_veiculos captura; do
            unzip -p monster-game/sprites_aprovados.zip "monster-game/assets/art/esqueleto_aprovado/$sprite.png" > "monster-game/assets/art/esqueleto_aprovado/$sprite.png"
            test -s "monster-game/assets/art/esqueleto_aprovado/$sprite.png"
          done
          # The original stable 0.8.13 zombie source must remain BYTE-FOR-BYTE identical.
          test "$(git hash-object monster-game/scripts/zombie_sprite.gd)" = "ed17fe2e70d1094022555af764e886474db128ea"
          test "$(git hash-object monster-game/scripts/zombie_stride.gd)" = "bbe26c1870667c4bcc9d937d3fa0cd87f7815a81"
          grep -q 'if kind == 0:' monster-game/scripts/actor.gd
          grep -q 'if kind == 1 and skeleton_approved.has_state' monster-game/scripts/actor.gd
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for name,rows in [('corrida',6),('pulo_pouso',5),('quebrar_veiculos',6),('captura',6)]:
              p=Path('monster-game/assets/art/esqueleto_aprovado')/(name+'.png')
              header=p.read_bytes()[:26]
              assert header[:8]==b'\x89PNG\r\n\x1a\n', name
              w,h=struct.unpack('>II',header[16:24])
              assert (w,h)==(2304,rows*288),(name,w,h)
              assert header[25]==6,(name,'not RGBA')
          print('ORIGINAL_ZOMBIE_PRESERVED; SKELETON_FOUR_ATLASES_VALID')
          PY

      - name: Require full corrected 0.8.13 source tree
        run: |
          set -euo pipefail
          test -s monster-game/NOTAS-v0.8.13-correcoes.md || { echo 'FULL_SOURCE_MISSING: first upload v0.8.13 project sources to this branch, not v0.7.'; exit 1; }
          grep -q 'version/name="0.8.13"' monster-game/export_presets.cfg
          test -s monster-game/tests/vehicle_survivors_test.gd
          test -s monster-game/assets/art/creatures.png
          test -s monster-game/assets/art/terrain-v089.png
          echo 'v0.8.13 source markers verified'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and dependencies
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Android build tools and headless rendering support
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Cache Godot 4.5.1 and Android templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates/4.5.1.stable
          key: horda-godot-4.5.1-android-v2

      - name: Install official Godot 4.5.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          if [ ! -x "$HOME/.local/bin/godot" ]; then
            curl -fL --retry 3 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip'
            mkdir -p /tmp/godot-editor
            unzip -q /tmp/godot.zip -d /tmp/godot-editor
            cp /tmp/godot-editor/Godot_v4.5.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
            chmod +x "$HOME/.local/bin/godot"
          fi
          if [ ! -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk" ]; then
            curl -fL --retry 3 -o /tmp/templates.tpz 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz'
            unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import project and inspect parser diagnostics
        run: |
          set -euo pipefail
          mkdir -p monster-game/build
          touch monster-game/build/.gdignore
          timeout 180 godot --headless --path monster-game --editor --import 2>&1 | tee monster-game/build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' monster-game/build/import.log; then exit 1; fi

      - name: Run focused v0.8.13 gameplay regression checks
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path monster-game --script res://tests/ci_smoke.gd 2>&1 | tee monster-game/build/test.log
          grep -q 'HORDE_CI_SMOKE_OK' monster-game/build/test.log
          if grep -E 'SCRIPT ERROR|HORDE_CI_SMOKE_FAIL|HORDE_VEHICLE_SURVIVORS_FAIL|HORDE_0813_FAIL' monster-game/build/test.log; then exit 1; fi
          timeout 120 godot --headless --path monster-game --script res://tests/skeleton_isolation_test.gd 2>&1 | tee monster-game/build/skeleton-test.log
          grep -q 'HORDE_SKELETON_ISOLATION_OK' monster-game/build/skeleton-test.log
          if grep -E 'SCRIPT ERROR|HORDE_SKELETON_ISOLATION_FAIL' monster-game/build/skeleton-test.log; then exit 1; fi

      - name: Prepare separate testing app and development signature
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/horda-0813-testing.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/horda-0813-testing.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Noite da Horda Testing,O=Kauan,C=BR'
          fi
          python3 monster-game/tools/configure_export.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('monster-game/export_presets.cfg')
          s=p.read_text()
          assert 'package/unique_name="com.kauan.noitedahorda"' in s
          s=s.replace('package/unique_name="com.kauan.noitedahorda"', 'package/unique_name="com.kauan.noitedahorda.esqueletolimpo0813"')
          s=s.replace('package/name="Noite da Horda"', 'package/name="Horda Esqueleto 0813 LIMPO"')
          p.write_text(s)
          project=Path('monster-game/project.godot')
          project_text=project.read_text()
          project_text=project_text.replace('config/name="Noite da Horda"', 'config/name="Horda Esqueleto 0813 LIMPO"')
          project.write_text(project_text)
          PY
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/horda-0813-testing.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Export APK and validate package
        run: |
          set -euo pipefail
          godot --headless --path monster-game --export-debug Android build/Horda-0813-Esqueleto-Limpo.apk 2>&1 | tee monster-game/build/export.log
          test -s monster-game/build/Horda-0813-Esqueleto-Limpo.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose monster-game/build/Horda-0813-Esqueleto-Limpo.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging monster-game/build/Horda-0813-Esqueleto-Limpo.apk > monster-game/build/apk-info.txt
          grep -q "package: name='com.kauan.noitedahorda.esqueletolimpo0813'" monster-game/build/apk-info.txt
          sha256sum monster-game/build/Horda-0813-Esqueleto-Limpo.apk > monster-game/build/SHA256SUMS.txt
          echo 'Android v0.8.13 testing APK generated and verified'

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: Horda-0813-Esqueleto-Limpo
          path: monster-game/build/Horda-0813-Esqueleto-Limpo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoiteDaHorda-v0.8.13-build-logs
          path: monster-game/build/*.log
          if-no-files-found: ignore
