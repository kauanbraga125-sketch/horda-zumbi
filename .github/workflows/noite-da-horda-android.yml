name: Horda Zumbi — validar fontes completas
on:
  push:
    branches: [main]
    paths: ['monster-game/**', '.github/workflows/noite-da-horda-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.5.1 oficial
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Importar fontes sem cache e atualizar auditoria
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path monster-game --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load' /tmp/import.log; then exit 1; fi
          python3 monster-game/tools/refresh_startup_integrity.py
      - name: Validar progressão, inventário, livro e inicialização
        run: |
          set -euo pipefail
          for SUITE in v100_integration v101_integration v103_codex v103_apk_runtime v104_integration v105_integration; do
            /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path monster-game --script "res://tests/${SUITE}.gd" 2>&1 | tee "/tmp/${SUITE}.log"
            if grep -E 'SCRIPT ERROR|Parse Error|FAIL |failures=[1-9]' "/tmp/${SUITE}.log"; then exit 1; fi
            grep -E 'RESULT.*failures=0' "/tmp/${SUITE}.log"
          done
      - name: Validar abertura, saldo de testes e poder espacial
        run: |
          set -euo pipefail
          for SUITE in verify_packaged_boot v129_currency v135_adventure v135_readability v135_flight v135_contacts v136_systems v139_sewer v139_journeys; do
            /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --audio-driver Dummy --path monster-game --script "res://tests/${SUITE}.gd" -- --space-test 2>&1 | tee "/tmp/${SUITE}.log"
            if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' "/tmp/${SUITE}.log"; then exit 1; fi
          done
      - name: Conferir saldo e acesso ao espaço na abertura normal
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          for FIXTURE in new existing; do
            XDG_DATA_HOME="$RUNNER_TEMP/horda-startup-${FIXTURE}" HORDA_STARTUP_FIXTURE="$FIXTURE" HORDA_VALIDATION_DIR="$RUNNER_TEMP/startup-${FIXTURE}" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v139_startup.gd 2>&1 | tee "/tmp/startup-${FIXTURE}.log"
            if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' "/tmp/startup-${FIXTURE}.log"; then exit 1; fi
          done
      - name: Conferir recorte real dos ocupantes nas cabines
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/cabins" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v133_cabins.gd 2>&1 | tee /tmp/cabins.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/cabins.log; then exit 1; fi
      - name: Conferir sorteio, fusão, reabertura e controles do esgoto
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          XDG_DATA_HOME="$RUNNER_TEMP/horda-v136-transactions" HORDA_VALIDATION_DIR="$RUNNER_TEMP/transactions-v136" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v139_transactions.gd 2>&1 | tee /tmp/transactions-v136.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/transactions-v136.log; then exit 1; fi
      - name: Conferir todas as poses novas e os 35 acessórios sentados
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/riders-v138" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v139_riders.gd 2>&1 | tee /tmp/riders-v138.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/riders-v138.log; then exit 1; fi
          grep -q 'V139_RIDERS_OK' /tmp/riders-v138.log
      - name: Conferir opacidade dos rostos em todas as poses e acessórios
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          set -euo pipefail
          HORDA_VALIDATION_DIR="$RUNNER_TEMP/faces-v139" xvfb-run -a /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --path monster-game --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/v139_faces.gd 2>&1 | tee /tmp/faces-v139.log
          if grep -E '^ERROR:|SCRIPT ERROR|Parse Error' /tmp/faces-v139.log; then exit 1; fi
          grep -q '"failures":\[\]' /tmp/faces-v139.log
